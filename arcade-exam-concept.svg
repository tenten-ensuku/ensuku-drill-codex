  <circle cx="1340" cy="120" r="170" fill="#db2777" opacity="0.12"/>
  <circle cx="230" cy="760" r="220" fill="#06b6d4" opacity="0.11"/>

  <text x="92" y="88" class="jp title cream">アーケード検定 UI コンセプト</text>
