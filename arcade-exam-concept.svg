<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <radialGradient id="bg" cx="50%" cy="25%" r="80%">
      <stop offset="0" stop-color="#1b1b66"/>
      <stop offset="0.42" stop-color="#090b2e"/>
      <stop offset="1" stop-color="#040412"/>
    </radialGradient>
    <linearGradient id="neonPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13184a"/>
      <stop offset="0.55" stop-color="#0a102f"/>
      <stop offset="1" stop-color="#13071f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.2" stop-color="#f59e0b"/>
      <stop offset="0.4" stop-color="#22c55e"/>
      <stop offset="0.6" stop-color="#06b6d4"/>
      <stop offset="0.8" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#22d3ee" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#22d3ee" flood-opacity="0.35"/>
    </filter>
    <filter id="glowPink" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#f472b6" flood-opacity="0.82"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#f472b6" flood-opacity="0.35"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#67e8f9" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .jp { font-family: "Inter", "Yu Gothic UI", "Meiryo", sans-serif; letter-spacing: 0; }
      .small { font-size: 18px; }
      .label { font-size: 22px; font-weight: 800; }
      .title { font-size: 40px; font-weight: 900; }
      .cream { fill: #f8fbff; }
      .muted { fill: #a7b5ff; }
      .tileText { font-size: 34px; font-weight: 900; fill: #1e1b4b; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#bg)"/>
  <rect width="1600" height="1050" fill="url(#grid)"/>
  <path d="M0 880L330 600L620 750L940 430L1210 595L1600 250" fill="none" stroke="#f472b6" stroke-opacity="0.2" stroke-width="3"/>
