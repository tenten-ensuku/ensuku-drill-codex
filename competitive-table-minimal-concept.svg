<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2f28"/>
      <stop offset="0.55" stop-color="#0f493c"/>
      <stop offset="1" stop-color="#071f1c"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101716"/>
      <stop offset="1" stop-color="#050807"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.45" stop-color="#d8a83c"/>
      <stop offset="1" stop-color="#8d6420"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff665c"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <pattern id="feltNoise" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="transparent"/>
      <path d="M0 4H10M2 0V10" stroke="#ffffff" stroke-opacity="0.018" stroke-width="1"/>
    </pattern>
    <style>
      .jp { font-family: "Inter", "Yu Gothic UI", "Meiryo", sans-serif; }
      .small { font-size: 18px; letter-spacing: 0; }
      .label { font-size: 22px; letter-spacing: 0; font-weight: 700; }
      .title { font-size: 40px; letter-spacing: 0; font-weight: 800; }
      .tileText { font-size: 34px; font-weight: 800; fill: #1a1a1a; }
      .muted { fill: #9aa9a4; }
      .cream { fill: #f6f2df; }
      .panelStroke { stroke: #d6c58a; stroke-opacity: 0.22; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#07120f"/>
  <rect x="0" y="0" width="1600" height="1050" fill="url(#felt)"/>
  <rect x="0" y="0" width="1600" height="1050" fill="url(#feltNoise)"/>
  <path d="M-80 850C260 760 470 910 820 770C1160 635 1320 760 1680 625" fill="none" stroke="#f5d77a" stroke-opacity="0.07" stroke-width="2"/>
  <path d="M-120 240C240 325 470 210 730 290C1060 390 1260 260 1710 340" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="2"/>

  <text x="92" y="88" class="jp title cream">競技卓ミニマル UI コンセプト</text>
  <text x="94" y="124" class="jp small muted">麻雀卓の集中感、競技アプリの情報密度、ランク演出の高揚感を同じ画面文法にまとめる方向性</text>

