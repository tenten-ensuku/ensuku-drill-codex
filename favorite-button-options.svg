  <g transform="translate(52 530)">
    <rect width="876" height="58" rx="22" fill="#0c1715" stroke="#f6f2df" stroke-opacity=".08"/>
    <text x="24" y="36" class="jp note">案5: アイコンを左に分離したカード内ツール風</text>
    <g transform="translate(410 10)">
      <rect width="132" height="38" rx="14" fill="#f3f6f4"/>
      <circle cx="24" cy="19" r="13" fill="#fff3bf"/>
      <text x="17" y="25" class="jp btnText" fill="#eab308">★</text>
      <text x="44" y="25" class="jp btnText" fill="#52635f">追加</text>
    </g>
    <g transform="translate(560 10)">
      <rect width="132" height="38" rx="14" fill="#e8eef0"/>
      <circle cx="24" cy="19" r="13" fill="#d5dde0"/>
      <text x="17" y="25" class="jp btnText" fill="#849096">★</text>
      <text x="44" y="25" class="jp btnText" fill="#849096">追加済</text>
    </g>
