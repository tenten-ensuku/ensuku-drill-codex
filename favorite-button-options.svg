  <g transform="translate(52 430)">
    <rect width="876" height="78" rx="22" fill="#0c1715" stroke="#f6f2df" stroke-opacity=".08"/>
    <text x="24" y="32" class="jp note">案4: ゴールド枠の競技感、追加済みは反転グレー</text>
    <g transform="translate(410 20)">
      <rect width="124" height="38" rx="10" fill="#101a18" stroke="#d8a83c" stroke-width="2"/>
      <text x="17" y="25" class="jp btnText" fill="#f7e4a4">★ 追加</text>
      <text x="18" y="25" class="jp btnText" fill="#facc15">★</text>
    </g>
    <g transform="translate(552 20)">
      <rect width="124" height="38" rx="10" fill="#2c3431" stroke="#7d8784"/>
      <text x="17" y="25" class="jp btnText" fill="#b8c2bf">★ 追加済</text>
    </g>
