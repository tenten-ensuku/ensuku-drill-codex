    function SelfAnalysis({ resultsHistory, dailySummary, problemStats, tap }) {
      const [modeId, setModeId] = useState("6");
      const [chartTipIndex, setChartTipIndex] = useState(null);
      const selectedMode = getMode(modeId);
      useEffect(() => setChartTipIndex(null), [modeId]);
      const completed = resultsHistory.filter(r => (r.variant === "normal" || r.variant === "ura") && !r.gameOver && r.modeId === modeId);
      const summaries = Object.values(dailySummary || {});
      const modeSummaries = summaries.filter(row => row.modeId === modeId);
      const summaryTotals = modeSummaries.reduce((acc, row) => ({
        plays: acc.plays + (row.playCount || 0),
        score: acc.score + (row.totalScore || 0),
        correct: acc.correct + (row.totalCorrect || 0),
        mistakes: acc.mistakes + (row.totalMistakes || 0),
        elapsed: acc.elapsed + (row.totalElapsed || 0),
        records: acc.records + (row.recordCount || 0)
      }), { plays: 0, score: 0, correct: 0, mistakes: 0, elapsed: 0, records: 0 });
      const fallbackTotals = completed.reduce((acc, row) => ({
        plays: acc.plays + 1,
        score: acc.score + row.score,
        correct: acc.correct + row.correctCount,
        mistakes: acc.mistakes + row.mistakeCount,
        elapsed: acc.elapsed + row.elapsedSeconds,
        records: acc.records + (row.isNewRecord ? 1 : 0)
      }), { plays: 0, score: 0, correct: 0, mistakes: 0, elapsed: 0, records: 0 });
      const totals = summaryTotals.plays > completed.length ? summaryTotals : fallbackTotals;
      const today = dateKey();
      const todayFromSummary = modeSummaries.filter(row => row.date === today).reduce((sum, row) => sum + (row.playCount || 0), 0);
      const todayCount = todayFromSummary || completed.filter(row => dateKey(row.finishedAt) === today).length;
      const best = completed.reduce((top, row) => !top || row.score > top.score ? row : top, null);
      const problemKind = selectedMode?.tileCount === 10 ? "10" : String(selectedMode?.tileCount || 6);
      const problemTotals = Object.entries(problemStats || {})
        .filter(([baseId]) => baseId.startsWith(`${problemKind}-`))
        .reduce((acc, [, stat]) => ({
          correct: acc.correct + (stat.correct || 0),
          total: acc.total + (stat.total || 0)
        }), { correct: 0, total: 0 });
      const answerTotal = totals.correct + totals.mistakes;
      const avgRate = problemTotals.total ? Math.round((problemTotals.correct / problemTotals.total) * 100) : (answerTotal ? Math.round((totals.correct / answerTotal) * 100) : null);
      const avgSec = answerTotal ? (totals.elapsed / answerTotal).toFixed(1) : "--";
      const historyDaily = {};
      completed.forEach(row => {
        const day = dateKey(row.finishedAt);
        const key = `${day}:${row.modeId}`;
        const averageSeconds = Number((row.elapsedSeconds / Math.max(1, row.questionCount)).toFixed(1));
        const prev = historyDaily[key];
        if (!prev) {
          historyDaily[key] = {
            date: day,
            modeId: row.modeId,
            playCount: 1,
            bestScore: row.score,
            bestRank: rankFor(row.modeId, row.score),
            bestElapsed: row.elapsedSeconds,
            bestQuestionCount: row.questionCount,
            bestAverageSeconds: averageSeconds
          };
        } else {
          prev.playCount += 1;
          if (row.score > prev.bestScore || (row.score === prev.bestScore && averageSeconds < prev.bestAverageSeconds)) {
            prev.bestScore = row.score;
            prev.bestRank = rankFor(row.modeId, row.score);
            prev.bestElapsed = row.elapsedSeconds;
            prev.bestQuestionCount = row.questionCount;
            prev.bestAverageSeconds = averageSeconds;
            prev.modeId = row.modeId;
          }
        }
      });
      const summaryDaily = {};
      modeSummaries.forEach(row => {
        const key = `${row.date}:${row.modeId}`;
        const prev = summaryDaily[key];
        const candidate = {
          date: row.date,
          modeId: row.modeId,
          playCount: row.playCount || 0,
          bestScore: row.bestScore || 0,
          bestRank: rankFor(row.modeId, row.bestScore || 0),
          bestElapsed: row.bestElapsed || 0,
          bestQuestionCount: row.bestQuestionCount || getMode(row.modeId)?.questionCount || 1,
          bestAverageSeconds: row.bestAverageSeconds ?? (row.bestElapsed ? Number((row.bestElapsed / Math.max(1, row.bestQuestionCount || getMode(row.modeId)?.questionCount || 1)).toFixed(1)) : null)
        };
        if (!prev) {
          summaryDaily[key] = candidate;
        } else {
          prev.playCount += candidate.playCount;
          const prevAvg = prev.bestAverageSeconds ?? Infinity;
          const nextAvg = candidate.bestAverageSeconds ?? Infinity;
          if (candidate.bestScore > prev.bestScore || (candidate.bestScore === prev.bestScore && nextAvg < prevAvg)) {
            summaryDaily[key] = { ...candidate, playCount: prev.playCount };
          }
        }
      });
      const dailyMap = { ...summaryDaily, ...historyDaily };
      const dailyRows = Object.values(dailyMap).sort((a, b) => a.date.localeCompare(b.date));
      let runningBestScore = -Infinity;
      const chartRows = dailyRows.filter(row => {
        if ((row.bestScore || 0) <= runningBestScore) return false;
        runningBestScore = row.bestScore || 0;
        return true;
      });
      const chartListRows = chartRows.slice().reverse();
      const chartMinWidth = "100%";
      const chartTip = chartTipIndex === null ? null : chartRows[chartTipIndex];
      const firstRecord = chartRows[0] || null;
      const latestRecord = chartRows[chartRows.length - 1] || null;
      const recordGrowth = firstRecord && latestRecord ? latestRecord.bestScore - firstRecord.bestScore : 0;
      const rankKey = selectedMode?.rankKey || modeId;
      const finiteThresholds = (RANKS[rankKey] || RANKS["6"])
        .map(([, threshold]) => threshold)
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
      const firstScore = firstRecord?.bestScore || 0;
      const latestScore = latestRecord?.bestScore || firstScore;
      const belowRankLine = [...finiteThresholds].reverse().find(value => value < firstScore);
      const aboveRankLine = finiteThresholds.find(value => value > latestScore);
      const minChartSpan = modeId === "10_all" ? 200 : selectedMode?.tileCount === 10 ? 45 : 20;
      let chartMin = Math.max(0, Math.min(belowRankLine ?? Math.max(0, firstScore - minChartSpan), Math.max(0, firstScore - 5)));
      let chartMax = Math.max(aboveRankLine ?? latestScore + minChartSpan, latestScore + 5);
      if (chartMax - chartMin < minChartSpan) {
        const mid = (chartMax + chartMin) / 2;
        chartMin = Math.max(0, Math.floor(mid - minChartSpan / 2));
        chartMax = Math.ceil(chartMin + minChartSpan);
      }
      const chartSpan = Math.max(1, chartMax - chartMin);
      const scoreRatio = score => Math.min(Math.max(((Number(score) || 0) - chartMin) / chartSpan, 0), 1);
      const chartPointY = score => 92 - scoreRatio(score) * 82;
      const chartLinePoints = chartRows
        .map((row, idx) => {
          const x = ((idx + 0.5) / Math.max(1, chartRows.length)) * 100;
          const y = chartPointY(row.bestScore);
          return `${x.toFixed(2)},${y.toFixed(2)}`;
        })
        .join(" ");
      const weakItems = Object.entries(problemStats || {})
        .map(([baseId, stat]) => ({ baseId, ...stat, rate: stat.total > 0 ? Math.round((stat.correct / stat.total) * 100) : null }))
        .filter(item => item.baseId.startsWith(`${problemKind}-`))
        .filter(item => item.total > 0)
        .sort((a, b) => (a.rate - b.rate) || (b.total - a.total))
        .slice(0, 5)
        .map(item => {
          const [tileCount] = item.baseId.split("-");
          const base = DATASETS[tileCount === "10" ? "10" : tileCount]?.find(q => q.baseId === item.baseId);
          return base ? { ...item, ...base, suit: tileCount === "6" ? "m" : tileCount === "7" ? "s" : "p" } : item;
        })
        .filter(item => item.tiles);
      return (
        <section className="panel rounded-3xl p-4">
          <h2 className="text-xl font-black">成長ログ</h2>
          <div className="mt-4 grid grid-cols-2 gap-2 rounded-2xl bg-black/20 p-1">
            {MODES.map(mode => (
              <button key={mode.id} className={`rounded-2xl px-2 py-2 text-xs font-black ${modeId === mode.id ? "btn-main" : "btn-quiet"}`} {...tap(() => setModeId(mode.id))}>{mode.label}</button>
            ))}
          </div>
          <div className="mt-4 grid grid-cols-3 gap-2 text-center">
            <Stat label="総プレイ" value={totals.plays} compact />
            <Stat label="今日" value={todayCount} compact />
            <Stat label="最高" value={best ? <RankBadge rank={rankFor(best.modeId, best.score)} size="leaderboard" /> : "--"} compact />
            <Stat label="平均正答率" value={avgRate === null ? "--" : `${avgRate}%`} compact />
            <Stat label="平均秒/問" value={`${avgSec}秒`} compact />
            <Stat label="記録更新" value={totals.records} compact />
          </div>

          <div className="mt-5 flex items-end justify-between gap-3">
            <div>
              <h3 className="text-sm font-black text-[color:var(--muted)]">自己ベスト更新推移</h3>
              <p className="mt-1 text-[11px] font-bold text-[color:var(--muted)]">自己記録を更新した日だけを表示</p>
            </div>
            <div className="shrink-0 text-right">
              <p className="text-sm font-black text-[color:var(--gold-2)]">{recordGrowth > 0 ? `+${recordGrowth}pt` : "--"}</p>
              <p className="text-[10px] font-bold text-[color:var(--muted)]">{chartRows.length ? `${Math.max(0, chartRows.length - 1)}回更新` : "更新なし"}</p>
            </div>
          </div>
          {chartRows.length > 1 && (
            <div className="mt-2 rounded-2xl bg-black/20 px-3 py-2 text-[11px] font-bold text-[color:var(--muted)]">
              初回 {firstRecord.bestScore}pt → 現在 {latestRecord.bestScore}pt / 表示範囲 {chartMin}〜{chartMax}pt
            </div>
          )}
          <div className="mt-3 overflow-hidden pb-1">
            <div className="relative flex h-24 items-end gap-1 rounded-2xl bg-black/20 p-3" style={{ minWidth: chartMinWidth }}>
              {chartRows.length > 1 && (
                <svg className="daily-chart-line pointer-events-none z-30 overflow-visible" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                  <polyline points={chartLinePoints} fill="none" stroke="rgba(255,247,218,0.9)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />
                  {chartRows.map((row, idx) => {
                    const x = ((idx + 0.5) / Math.max(1, chartRows.length)) * 100;
                    const y = chartPointY(row.bestScore);
                    return <circle key={`${row.date}-${idx}-point`} cx={x} cy={y} r="1.8" fill="rgba(255,247,218,0.98)" stroke="rgba(26,186,193,0.9)" strokeWidth="0.8" />;
                  })}
                </svg>
              )}
              {chartRows.length ? chartRows.map((row, idx) => (
                <button
                  key={`${row.date}-${row.modeId || "all"}-${idx}`}
                  type="button"
                  className="relative z-20 flex flex-1 items-end justify-center self-stretch rounded outline-none"
                  aria-label={`${row.date} ${row.bestScore}pt`}
                  {...tap(() => setChartTipIndex(idx))}
                >
                  <span
                    className={`w-full max-w-[18px] rounded-t bg-[color:var(--gold)] transition ${chartTipIndex === idx ? "opacity-100 ring-2 ring-[color:var(--cream)]" : "opacity-80"}`}
                    style={{ height: `${10 + scoreRatio(row.bestScore) * 82}%` }}
                    title={`${row.date} ${row.bestScore}pt`}
                  />
                </button>
              )) : <p className="m-auto text-sm font-bold text-[color:var(--muted)]">履歴がまだありません。</p>}
            </div>
          </div>
          {chartTip && (
            <div className="mt-2 rounded-2xl bg-black/25 px-3 py-2 text-xs font-bold text-[color:var(--cream)]">
              <span>{chartTip.date}</span>
              <span className="mx-2 text-[color:var(--muted)]">/</span>
              <span>{chartTip.bestScore}pt</span>
              <span className="mx-2 text-[color:var(--muted)]">/</span>
              <span><RankBadge rank={chartTip.bestRank} size="leaderboard" /></span>
              <span className="mx-2 text-[color:var(--muted)]">/</span>
              <span>{chartTip.bestAverageSeconds ?? "--"}秒/問</span>
            </div>
          )}

          <details className="mt-5 rounded-2xl bg-black/20 p-2">
            <summary className="btn-quiet cursor-pointer list-none rounded-2xl px-4 py-3 text-center text-sm font-black">
              自己ベスト更新履歴を見る
            </summary>
            <div className="mt-3 space-y-2">
            {chartListRows.length ? chartListRows.map(row => (
              <div key={`${row.date}-${row.modeId || "all"}`} className="grid grid-cols-[1fr_auto] gap-2 rounded-2xl bg-black/20 p-3">
                <div>
                  <p className="text-sm font-black">{row.date}</p>
                  <p className="text-[11px] font-bold text-[color:var(--muted)]">{row.playCount}プレイ</p>
                </div>
                <div className="text-right">
                  <p className="text-sm font-black">{row.bestScore}pt <span className={rankClass(row.bestRank)}><RankBadge rank={row.bestRank} size="leaderboard" /></span></p>
                  <p className="text-[11px] font-bold text-[color:var(--muted)]">{row.bestAverageSeconds ?? "--"}秒/問</p>
                </div>
              </div>
            )) : <p className="py-4 text-center text-sm font-bold text-[color:var(--muted)]">自己ベスト更新履歴はまだありません。</p>}
            </div>
          </details>

          <h3 className="mt-5 text-sm font-black text-[color:var(--muted)]">苦手な形</h3>
          <div className="mt-3 space-y-2">
            {weakItems.length ? weakItems.map(item => (
              <div key={item.baseId} className="rounded-2xl bg-black/20 p-3">
                <div className="flex items-center justify-between gap-3">
                  <MiniHand q={item} />
                  <div className="shrink-0 text-right">
                    <p className="text-lg font-black">{item.rate}%</p>
                    <p className="text-[10px] font-bold text-[color:var(--muted)]">{item.correct}/{item.total}</p>
                  </div>
                </div>
                <p className="mt-2 text-xs font-bold text-[color:var(--muted)]">待ち {item.answers.join(", ")}</p>
              </div>
            )) : <p className="py-4 text-center text-sm font-bold text-[color:var(--muted)]">苦手分析はまだありません。</p>}
          </div>
        </section>
      );
    }

    function Game({ game, q, elapsed, selectAnswer, confirmAnswer, addFavorite, isFavorite, favoriteFlash, quit, retry, answerPadSize, answerPadAlign, answerPadLayout, slideTouch, judgeFlash, tap }) {
      const counts = q.tiles.reduce((acc, n) => ({ ...acc, [n]: (acc[n] || 0) + 1 }), {});
      const isUra = game.variant === "ura";
      const showGameOver = isUra && game.gameOverWrong;
      const questionTileCount = q.tileCount || q.tiles.length || game.mode.tileCount;
      const questionModeLabel = modeLabelForTileCount(questionTileCount) || game.mode.label;
      const promptTitle = questionTileCount === 6 ? "2面子完成となる受け入れは？" : "何待ち？";
      const answerNumbers = ANSWER_PAD_LAYOUTS[answerPadLayout] || ANSWER_PAD_LAYOUTS.default;
      const answerDragRef = useRef(null);
      const lastTouchAtRef = useRef(0);

      function pressAnswerKey(num, event, source = "pointer") {
        if ((counts[num] || 0) >= 4 || game.feedback || showGameOver) return;
        if (event) {
          if (source !== "touch") event.preventDefault();
          event.stopPropagation();
        }
        if (source === "pointer" && performance.now() - lastTouchAtRef.current < 500) return;
        answerDragRef.current = num;
        selectAnswer(num);
      }

      function keyFromTouch(event) {
        const touchPoint = event.touches && event.touches[0];
        if (!touchPoint) return null;
        const element = document.elementFromPoint(touchPoint.clientX, touchPoint.clientY);
        const key = element && element.closest ? element.closest("[data-answer-key]") : null;
        return key ? Number(key.dataset.answerKey) : null;
      }

      useEffect(() => {
        function onKey(e) {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          const tag = (e.target?.tagName || "").toLowerCase();
          if (tag === "input" || tag === "textarea") return;
          if (e.isComposing) return;
          if (showGameOver || game.feedback) return;
          if (e.key >= "1" && e.key <= "9") {
            const num = Number(e.key);
            if ((counts[num] || 0) >= 4) return;
            e.preventDefault();
            selectAnswer(num);
          } else if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
            if (isUra) return;
            if (game.selected.length === 0) return;
            e.preventDefault();
            confirmAnswer();
          }
        }
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, [game, q, selectAnswer, confirmAnswer, isUra, showGameOver]);

      return (
        <div className={`play-pad mx-auto flex h-screen max-h-screen w-full max-w-md flex-col overflow-hidden px-4 py-3 ${showGameOver ? "game-over-active" : ""}`}>
          <div className="play-content flex min-h-0 flex-1 flex-col">
            <header className="mb-4 flex items-center justify-between gap-2">
              <div>
                <div className="text-sm font-black text-[color:var(--gold-2)]">{game.index + 1} / {game.questions.length}</div>
                <div className="mt-2 h-1.5 w-36 rounded-full bg-black/35">
                  <div className="h-1.5 rounded-full bg-[color:var(--gold)]" style={{ width: `${((game.index + 1) / game.questions.length) * 100}%` }} />
                </div>
              </div>
              <div className="text-right">
                <div className="text-2xl font-black">{formatTime(elapsed)}</div>
                <div className="text-xs font-bold text-[color:var(--muted)]">{isUra ? "裏モード" : questionModeLabel}</div>
              </div>
            </header>

            <section className="panel panel-tight mb-2 rounded-3xl p-4">
              <p className="mb-3 text-center text-sm font-black text-[color:var(--gold-2)]">{promptTitle}</p>
              <Hand q={q} />
            </section>

            <div className={`answer-zone align-${answerPadAlign}`}>
              {judgeFlash && (
                <div key={judgeFlash.id} className={`judge-flash ${judgeFlash.type}`}>
                  {judgeFlash.type === "ok" ? "○" : "×"}
                </div>
              )}
              <section className={`answer-pad size-${answerPadSize} align-${answerPadAlign} grid grid-cols-3 content-start gap-0`}>
                {answerNumbers.map(num => {
                  const disabled = (counts[num] || 0) >= 4;
                  const selected = game.selected.includes(num);
                  return (
                    <button
                      key={num}
                      type="button"
                      data-answer-key={num}
                      disabled={disabled || !!game.feedback}
                      className={`answer-btn pressable ${selected ? "selected" : ""} ${disabled ? "disabled" : ""} ${isUra && !selected ? "ura" : ""} ${game.gameOverWrong === num ? "wrong" : ""}`}
                      onPointerDown={event => {
                        if (event.pointerType === "touch") return;
                        pressAnswerKey(num, event, "pointer");
                      }}
                      onPointerEnter={event => {
                        if (!slideTouch || event.pointerType === "touch" || event.buttons !== 1 || answerDragRef.current === num) return;
                        pressAnswerKey(num, event, "pointer");
                      }}
                      onPointerUp={() => { answerDragRef.current = null; }}
                      onPointerCancel={() => { answerDragRef.current = null; }}
                      onTouchStart={event => {
                        lastTouchAtRef.current = performance.now();
                        pressAnswerKey(num, event, "touch");
                      }}
                      onTouchMove={event => {
                        if (!slideTouch) return;
                        const key = keyFromTouch(event);
                        if (!key || key === answerDragRef.current) return;
                        lastTouchAtRef.current = performance.now();
                        pressAnswerKey(key, event, "touch");
                      }}
                      onTouchEnd={() => { answerDragRef.current = null; }}
                      onTouchCancel={() => { answerDragRef.current = null; }}
                    >
                      {num}
                    </button>
                  );
                })}
              </section>
            </div>

            <div className={`answer-action size-${answerPadSize} align-${answerPadAlign} mt-1.5 ${isUra ? "pointer-events-none invisible" : ""}`}>
              <button className="answer-confirm btn-main pressable w-full px-4 py-4 text-lg font-black disabled:opacity-40" disabled={isUra || game.selected.length === 0 || !!game.feedback} {...tap(confirmAnswer)}>確定</button>
            </div>

            <footer className="mt-3 grid grid-cols-2 gap-2">
              <button className="btn-quiet rounded-2xl px-2 py-3 text-sm font-black disabled:opacity-40" disabled={!!game.feedback} {...tap(quit)}>メニュー</button>
              <button className="btn-quiet rounded-2xl px-2 py-3 text-sm font-black disabled:opacity-40" disabled={!!game.feedback} {...tap(retry)}>再挑戦</button>
            </footer>
          </div>
          {showGameOver && (
            <PlayGameOverOverlay
              game={game}
              q={game.gameOverQuestion || q}
              elapsed={elapsed}
              addFavorite={addFavorite}
              isFavorite={isFavorite}
              favoriteFlash={favoriteFlash}
              quit={quit}
              retry={retry}
              tap={tap}
            />
          )}
        </div>
      );
    }

    function PlayGameOverOverlay({ game, q, elapsed, addFavorite, isFavorite, favoriteFlash, quit, retry, tap }) {
      const selected = q?.selected || game.selected || [];
      useEnterToRetry(retry);
      return (
        <div className="play-gameover-overlay">
          <div className="ura-blackout"></div>
          <div className="ura-slash"></div>
          <div className="ura-crack"></div>

          <div className="ura-gameover-layer">
            <div className="gameover-logo">
              <div className="gameover-label">GAME<br />OVER</div>
            </div>

            <div className="ura-gameover-stats text-center">
              <Stat label="連続正解" value={game.correctCount} />
              <Stat label="時間" value={formatTime(elapsed)} />
            </div>

            <section className="ura-gameover-review">
              <h2 className="text-sm font-black">誤答問題</h2>
              <div className="mt-2 rounded-2xl bg-black/20 p-2">
                <MiniHand q={q} compact />
                <div className="mt-2 flex items-center justify-between gap-2">
                  <p className="min-w-0 text-xs text-[color:var(--muted)]">正解 {q.answers.join(", ")} / 選択 {selected.join(", ") || "-"}</p>
                  <StarFavoriteButton active={isFavorite(q)} justAdded={favoriteFlash === normalizeSavedQuestion(q).favoriteId} onPress={() => addFavorite(q)} tap={tap} label="お気に入りに追加" small />
                </div>
              </div>
            </section>

            <footer className="ura-gameover-actions">
              <button className="btn-quiet rounded-2xl px-4 py-3 text-sm font-black" {...tap(quit)}>メニュー</button>
              <button className="btn-main rounded-2xl px-4 py-3 text-sm font-black" {...tap(retry)}>再挑戦</button>
            </footer>
          </div>
        </div>
      );
    }

    function GameOverResult({ result, addFavorite, isFavorite, favoriteFlash, startMode, goHome, answerPadSize, answerPadAlign, answerPadLayout, tap }) {
      const wrong = result.wrongQuestions[0];
      const selected = wrong?.selected || [];
      const wrongPick = selected.find(num => !wrong?.answers.includes(num));
      const answerNumbers = ANSWER_PAD_LAYOUTS[answerPadLayout] || ANSWER_PAD_LAYOUTS.default;
      const retry = () => startMode(result.modeId, result.variant, result.sourceList);
      useEnterToRetry(retry);
      return (
        <div className="ura-gameover-screen">
          <div className="ura-fail-play">
            <header className="flex items-start justify-between gap-2">
              <div>
                <div className="text-sm font-black text-[color:var(--gold-2)]">{result.correctCount}連続</div>
                <div className="mt-2 h-1.5 w-36 rounded-full bg-black/35">
                  <div className="h-1.5 rounded-full bg-[color:var(--gold)]" style={{ width: `${Math.min(100, ((result.correctCount + 1) / result.questionCount) * 100)}%` }} />
                </div>
              </div>
              <div className="text-right">
                <div className="text-2xl font-black">{formatTime(result.elapsedSeconds)}</div>
                <div className="text-xs font-bold text-[color:var(--muted)]">裏モード</div>
              </div>
            </header>

            <section className="ura-fail-hand">
              <div className="mb-4 flex items-center justify-between">
                <span className="text-sm font-bold text-[color:var(--muted)]">牌姿</span>
              </div>
              {wrong && <Hand q={wrong} />}
            </section>

            <div className="feedback ng my-4">待ち {wrong?.answers.join(", ")}</div>

            <section className={`ura-fail-pad size-${answerPadSize} align-${answerPadAlign} grid grid-cols-3 content-start gap-0`}>
              {answerNumbers.map(num => {
                const disabled = wrong ? (wrong.tiles.filter(n => n === num).length >= 4) : false;
                return (
                  <button
                    key={num}
                    disabled
                    className={`answer-btn ${disabled ? "disabled" : "ura"} ${selected.includes(num) ? "selected" : ""} ${wrongPick === num ? "wrong" : ""}`}
                  >
                    {num}
                  </button>
                );
              })}
            </section>
          </div>

          <div className="ura-blackout"></div>
          <div className="ura-slash"></div>
          <div className="ura-crack"></div>

          <div className="ura-gameover-layer">
            <div className="gameover-logo">
              <div className="gameover-label">GAME<br />OVER</div>
            </div>

            <div className="ura-gameover-stats text-center">
              <Stat label="連続正解" value={result.correctCount} />
              <Stat label="時間" value={formatTime(result.elapsedSeconds)} />
            </div>

            {wrong && (
              <section className="ura-gameover-review">
                <h2 className="text-sm font-black">誤答問題</h2>
                <div className="mt-2 rounded-2xl bg-black/20 p-2">
                  <MiniHand q={wrong} compact />
                  <div className="mt-2 flex items-center justify-between gap-2">
                    <p className="min-w-0 text-xs text-[color:var(--muted)]">正解 {wrong.answers.join(", ")} / 選択 {selected.join(", ") || "-"}</p>
                    <StarFavoriteButton active={isFavorite(wrong)} justAdded={favoriteFlash === normalizeSavedQuestion(wrong).favoriteId} onPress={() => addFavorite(wrong)} tap={tap} label="お気に入りに追加" small />
                  </div>
                </div>
              </section>
            )}

            <footer className="ura-gameover-actions">
              <button className="btn-quiet rounded-2xl px-4 py-3 text-sm font-black" {...tap(goHome)}>メニュー</button>
              <button className="btn-main rounded-2xl px-4 py-3 text-sm font-black" {...tap(retry)}>再挑戦</button>
            </footer>
          </div>
        </div>
      );
    }

    function Result({ result, addFavorite, isFavorite, favoriteFlash, playerName, onRankingSubmitted, startMode, goHome, tap, tone }) {
      const [showPost, setShowPost] = useState(false);
      const [copied, setCopied] = useState(false);
      const [submitStatus, setSubmitStatus] = useState("");
      const [submittingRanking, setSubmittingRanking] = useState(false);
      const [rankingSubmitted, setRankingSubmitted] = useState(false);
      const [postedRank, setPostedRank] = useState(null);
      const [xSharing, setXSharing] = useState(false);
      const [xShareStatus, setXShareStatus] = useState("");
      const rankingSubmitLockRef = useRef(false);
      const [showPayloadFallback, setShowPayloadFallback] = useState(false);
      const [displayScore, setDisplayScore] = useState(result.variant === "favorite" || result.variant === "review" ? result.score : 0);
      const [showRank, setShowRank] = useState(result.variant === "favorite" || result.variant === "review");
      const [showComment, setShowComment] = useState(result.variant === "favorite" || result.variant === "review");
      const [showRecordStamp, setShowRecordStamp] = useState(false);
      const rankColor = rankClass(result.rank);
      const averageTime = formatAverageTime(result.elapsedSeconds, result.questionCount);
      const isPractice = result.variant === "favorite" || result.variant === "review";
      const canPostRanking = !isPractice;
      const submitName = normalizePlayerName(playerName);
      const gaugeRadius = 104;
      const gaugeCircumference = 2 * Math.PI * gaugeRadius;
      const gaugeProgress = isPractice ? 0 : scoreGaugeProgress(result.modeId, displayScore);
      const gaugeOffset = gaugeCircumference * (1 - gaugeProgress);
      const gaugeSegments = rankGaugeSegments(result.modeId);
      const retry = () => startMode(result.modeId, result.variant, result.sourceList);
      useEnterToRetry(retry);
      useEffect(() => {
        if (isPractice) {
          setDisplayScore(result.score);
          setShowComment(true);
          return;
        }
        setShowRecordStamp(false);
        setShowRank(false);
        setShowComment(false);
        setDisplayScore(0);
        let frame = 0;
        const started = performance.now();
        const eClearScore = Math.min(result.score, Math.max(0, rankThreshold(result.modeId, "D")));
        const eClearDuration = 500;
        const rankClimbDuration = 2500;
        const totalDuration = result.score <= eClearScore ? eClearDuration : eClearDuration + rankClimbDuration;
        function animatedScore(elapsed) {
          if (result.score <= eClearScore) {
            return result.score * Math.min(elapsed / eClearDuration, 1);
          }
          if (elapsed <= eClearDuration) {
            return eClearScore * Math.min(elapsed / eClearDuration, 1);
          }
          const rankT = Math.min((elapsed - eClearDuration) / rankClimbDuration, 1);
          return eClearScore + (result.score - eClearScore) * rankT;
        }
        function step(now) {
          const elapsed = Math.min(now - started, totalDuration);
          setDisplayScore(Math.round(animatedScore(elapsed)));
          const t = elapsed / totalDuration;
          if (t < 1) {
            frame = requestAnimationFrame(step);
          } else {
            setTimeout(() => setShowRank(true), 120);
            if (result.isNewRecord) {
              setTimeout(() => {
                tone?.("stamp");
                setShowRecordStamp(true);
              }, 540);
              setTimeout(() => setShowComment(true), 1040);
            } else {
              setTimeout(() => setShowComment(true), 520);
            }
          }
        }
        frame = requestAnimationFrame(step);
        return () => cancelAnimationFrame(frame);
      }, [result.finishedAt]);
      const publicPayload = rankingPayload(result, playerName);
      const publicPayloadText = JSON.stringify(publicPayload, null, 2);
      async function copyPayload() {
        setShowPayloadFallback(false);
        setSubmitStatus("");
        try {
          if (!navigator.clipboard?.writeText) throw new Error("clipboard unavailable");
          await navigator.clipboard.writeText(publicPayloadText);
          setCopied(true);
        } catch {
          setCopied(false);
          setShowPayloadFallback(true);
          setSubmitStatus("コピーできませんでした。下の投稿データを長押ししてコピーしてください。");
        }
      }
      async function postRanking() {
        if (rankingSubmitLockRef.current || submittingRanking || rankingSubmitted) return;
        rankingSubmitLockRef.current = true;
        setSubmitStatus("送信中...");
        setSubmittingRanking(true);
        setCopied(false);
        try {
          await submitRanking(result, playerName);
          const rank = await fetchRankPosition(result.modeId, "daily", playerName);
          setPostedRank(rank);
          setRankingSubmitted(true);
          onRankingSubmitted?.(result);
          setSubmitStatus(rank ? `現在${rank}です` : "順位を取得できませんでした");
        } catch (err) {
          setSubmitStatus(err.message || "投稿できませんでした");
          rankingSubmitLockRef.current = false;
        } finally {
          setSubmittingRanking(false);
        }
      }
      async function postToX() {
        if (xSharing) return;
        setXShareStatus("");
        setXSharing(true);
        try {
          const message = await shareResultToX(result);
          setXShareStatus(message);
        } catch (err) {
          setXShareStatus(err.message || "X投稿の準備に失敗しました");
        } finally {
          setXSharing(false);
        }
      }
      return (
        <div className="app-pad mx-auto flex min-h-screen w-full max-w-md flex-col px-4 py-3">
          <section className="panel record-card result-pop rounded-3xl p-4">
            {result.isNewRecord && <div className="record-rays" />}
            <div className="relative">
              <div className="flex items-start justify-between gap-3">
                <div>
                  <h1 className="text-3xl font-black">{isPractice ? "練習完了" : "成績発表"}</h1>
                </div>
                <div className="rounded-full border border-white/10 bg-black/24 px-3 py-2 text-xs font-black text-[color:var(--muted)]">{result.modeLabel}</div>
              </div>

              {!isPractice ? (
                <div className="mt-3 rounded-3xl border border-white/10 bg-black/30 p-4 text-center">
                  <div className="score-gauge">
                    <svg viewBox="0 0 240 240" aria-hidden="true">
                      <defs>
                        <linearGradient id="scoreGaugeFill" x1="0" x2="1" y1="0" y2="1">
                          <stop offset="0%" stopColor="#fffdf0" />
                          <stop offset="45%" stopColor="#f2d27b" />
                          <stop offset="100%" stopColor="#ffffff" />
                        </linearGradient>
                        <linearGradient id="scoreGaugeRainbow" x1="0" x2="1" y1="0" y2="1">
                          <stop offset="0%" stopColor="#ff2d55" />
                          <stop offset="16%" stopColor="#ffb000" />
                          <stop offset="32%" stopColor="#fff35c" />
                          <stop offset="48%" stopColor="#00e676" />
                          <stop offset="64%" stopColor="#00c8ff" />
                          <stop offset="82%" stopColor="#8b5cf6" />
                          <stop offset="100%" stopColor="#ff4fd8" />
                          <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="2.4s" repeatCount="indefinite" />
                        </linearGradient>
                      </defs>
                      <circle className="score-gauge-track" cx="120" cy="120" r={gaugeRadius} fill="none" strokeWidth="14" />
                      {gaugeSegments.map(seg => {
                        const length = Math.max(0.01, (seg.end - seg.start) * gaugeCircumference);
                        const offset = -seg.start * gaugeCircumference;
                        return (
                          <circle
                            key={seg.rank}
                            className={`score-gauge-segment ${seg.rank === "SS" ? "rainbow" : ""}`}
                            cx="120"
                            cy="120"
                            r={gaugeRadius}
                            fill="none"
                            stroke={seg.color}
                            strokeWidth={seg.rank === "SS" ? "12" : "10"}
                            strokeDasharray={`${length} ${gaugeCircumference - length}`}
                            strokeDashoffset={offset}
                          />
                        );
                      })}
                      <circle
                        className="score-gauge-fill"
                        cx="120"
                        cy="120"
                        r={gaugeRadius}
                        fill="none"
                        strokeWidth="14"
                        strokeDasharray={gaugeCircumference}
                        strokeDashoffset={gaugeOffset}
                      />
                    </svg>
                    <div className="score-gauge-center">
                      <div>
                        <div className={`score-rank text-6xl font-black ${rankColor} ${showRank ? "show" : ""}`}><RankBadge rank={result.rank} size="result" /></div>
                        <div className="score-number mt-2 text-4xl font-black">{displayScore}<span className="text-base text-[color:var(--gold)]">pt</span></div>
                      </div>
                    </div>
                    {showRecordStamp && <div className="record-stamp" aria-label="記録更新" />}
                  </div>
                  {showComment && (
                    <p className="mx-auto mt-2 max-w-xs text-xs font-bold leading-5 text-[color:var(--muted)]">{rankComment(result.rank, result.tileCount)}</p>
                  )}
                </div>
              ) : (
                <div className="mt-3 rounded-3xl border border-white/10 bg-black/30 p-4 text-center">
                  <p className="text-sm font-bold text-[color:var(--muted)]">{result.variant === "favorite" ? "お気に入り練習" : "復習"}</p>
                  <div className="mt-2 text-5xl font-black">{result.correctCount}<span className="text-xl text-[color:var(--gold)]"> / {result.questionCount}</span></div>
                </div>
              )}
            </div>
            <div className="mt-3 grid grid-cols-4 gap-1.5 text-center">
              <Stat label="正解" value={result.correctCount} icon="●" iconClass="text-[#ff4b4b]" compact />
              <Stat label="ミス" value={result.mistakeCount} icon="×" iconClass="text-[#63a7ff]" compact />
              <Stat label="時間" value={formatTime(result.elapsedSeconds)} icon="⏱" compact />
              <Stat label="1問平均" value={averageTime} compact />
            </div>
          </section>

          <footer className="mt-3 grid grid-cols-2 gap-2 pb-3">
            <button className="btn-quiet rounded-2xl px-4 py-3 text-sm font-black" {...tap(goHome)}>メニュー</button>
            <button className="btn-main rounded-2xl px-4 py-3 text-sm font-black" {...tap(retry)}>もう一度</button>
          </footer>

          {canPostRanking && (
          <section className="panel mt-3 rounded-3xl p-4">
            <button className="btn-quiet w-full rounded-2xl px-4 py-3 text-sm font-black" {...tap(() => setShowPost(v => !v))}>ランキング投稿</button>
            {showPost && (
              <div className="mt-3 space-y-3">
                <p className="text-sm leading-6 text-[color:var(--muted)]">設定で決めたニックネームで投稿されます</p>
                {isSupabaseReady() ? (
                  <button
                    className={`w-full rounded-2xl px-4 py-3 text-sm font-black ${rankingSubmitted ? "btn-quiet opacity-75" : "btn-main"}`}
                    disabled={submittingRanking || rankingSubmitted}
                    {...tap(postRanking)}
                  >
                    {rankingSubmitted ? "送信済み" : submittingRanking ? "送信中..." : `${submitName}で送信`}
                  </button>
                ) : (
                  <button className="btn-main w-full rounded-2xl px-4 py-3 text-sm font-black" {...tap(copyPayload)}>投稿データをコピー</button>
                )}
                <button
                  className="btn-quiet w-full rounded-2xl px-4 py-3 text-sm font-black"
                  disabled={xSharing}
                  {...tap(postToX)}
                >
                  {xSharing ? "準備中..." : "Xにポスト"}
                </button>
                {xShareStatus && <p className="text-center text-xs font-bold leading-5 text-[color:var(--muted)]">{xShareStatus}</p>}
                {submitStatus && <p className="text-center text-sm font-bold text-[color:var(--gold-2)]">{submitStatus}</p>}
                {copied && <p className="text-center text-sm font-bold text-[color:var(--gold-2)]">コピーしました</p>}
                {showPayloadFallback && (
                  <textarea
                    className="h-40 w-full rounded-2xl border border-white/10 bg-black/25 px-3 py-3 text-[11px] font-bold leading-5 text-[color:var(--cream)] outline-none"
                    readOnly
                    value={publicPayloadText}
                    onFocus={e => e.target.select()}
                  />
                )}
              </div>
            )}
          </section>
          )}

          {result.wrongQuestions.length > 0 && (
            <section className="panel mt-4 rounded-3xl p-4">
              <h2 className="text-lg font-black">誤答問題</h2>
              <div className="mt-3 space-y-3">
                {result.wrongQuestions.map(item => (
                  <div key={item.instanceId} className="rounded-2xl bg-black/20 p-3">
                    <MiniHand q={item} compact />
                    <div className="mt-2 flex items-center justify-between gap-2">
                      <p className="min-w-0 text-xs text-[color:var(--muted)]">正解 {item.answers.join(", ")} / 選択 {(item.selected || []).join(", ") || "-"}</p>
                      <StarFavoriteButton active={isFavorite(item)} justAdded={favoriteFlash === normalizeSavedQuestion(item).favoriteId} onPress={() => addFavorite(item)} tap={tap} label="お気に入りに追加" small />
                    </div>
                  </div>
                ))}
              </div>
            </section>
          )}

        </div>
      );
    }

    function Stat({ label, value, icon = null, iconClass = "text-[color:var(--gold-2)]", compact = false }) {
      return (
        <div className={`rounded-2xl bg-black/22 ${compact ? "px-1.5 py-2" : "p-3"}`}>
          <p className={`flex items-center justify-center gap-1 whitespace-nowrap font-bold text-[color:var(--muted)] ${compact ? "text-[10px]" : "text-xs"}`}>
            {icon && <span className={`text-sm leading-none ${iconClass}`}>{icon}</span>}
            <span>{label}</span>
          </p>
          <p className={`mt-1 whitespace-nowrap font-black ${compact ? "text-sm" : "text-lg"}`}>{value}</p>
        </div>
      );
    }

    function StarFavoriteButton({ active, justAdded, onPress, tap, label, small = false }) {
      return (
        <button
          className={`star-btn pressable ${active ? "active" : ""} ${justAdded ? "just-added" : ""} ${small ? "star-btn-small" : ""}`}
          aria-label={label}
          title={label}
          {...tap(onPress)}
        >
          <span className="star-mark">★</span>
          <span>{active ? "追加済" : "追加"}</span>
        </button>
      );
    }

    function Hand({ q }) {
      const normalizedQ = { ...q, tiles: sortedTiles(q.tiles) };
      const [slots, setSlots] = useState([normalizedQ, normalizedQ]);
      const [activeSlot, setActiveSlot] = useState(0);
      const activeSlotRef = useRef(0);
      const qKey = `${q.instanceId || q.baseId}-${q.suit}-${normalizedQ.tiles.join("")}`;
      useEffect(() => {
        let active = true;
        let raf1 = 0;
        let raf2 = 0;
        Promise.all(normalizedQ.tiles.map(num => ensureTileDecoded(q.suit, num))).then(() => {
          if (!active) return;
          const nextSlot = activeSlotRef.current === 0 ? 1 : 0;
          setSlots(prev => {
            const next = [...prev];
            next[nextSlot] = normalizedQ;
            return next;
          });
          raf1 = requestAnimationFrame(() => {
            raf2 = requestAnimationFrame(() => {
              if (!active) return;
              activeSlotRef.current = nextSlot;
              setActiveSlot(nextSlot);
            });
          });
        });
        return () => {
          active = false;
          cancelAnimationFrame(raf1);
          cancelAnimationFrame(raf2);
        };
      }, [qKey]);
      return (
        <div className="relative w-full overflow-hidden">
          {slots.map((slotQ, slot) => {
            const count = slotQ.tiles.length;
            const width = count >= 10
              ? "min(40px, calc((100% - 9px) / 10))"
              : count === 7
                ? "min(48px, calc((100% - 6px) / 7))"
                : "min(54px, calc((100% - 5px) / 6))";
            const visible = slot === activeSlot;
            return (
              <div
                key={slot}
                className={`flex w-full items-center justify-center gap-px overflow-hidden ${visible ? "relative" : "absolute left-0 top-0"}`}
                style={{ opacity: visible ? 1 : 0, visibility: visible ? "visible" : "hidden", pointerEvents: visible ? "auto" : "none" }}
              >
                {slotQ.tiles.map((num, idx) => (
                  <Tile key={`${idx}-${num}`} suit={slotQ.suit} num={num} width={width} />
                ))}
              </div>
            );
          })}
        </div>
      );
    }

    function MiniHand({ q, compact = false }) {
      const tiles = sortedTiles(q.tiles);
      const width = compact
        ? tiles.length >= 10 ? "clamp(18px, 6.4vw, 23px)" : tiles.length >= 7 ? "clamp(20px, 7vw, 25px)" : 24
        : tiles.length >= 10 ? "clamp(14px, 4.8vw, 24px)" : tiles.length >= 7 ? "clamp(19px, 6.2vw, 25px)" : 24;
      return (
        <div className="flex min-w-0 flex-1 items-center gap-px overflow-hidden">
          {tiles.map((num, idx) => <Tile key={`${idx}-${num}`} suit={q.suit} num={num} width={width} />)}
        </div>
      );
    }

    function Tile({ suit, num, width }) {
      const [error, setError] = useState(false);
      useEffect(() => setError(false), [suit, num]);
      const color = suit === "m" ? "#b91c1c" : suit === "p" ? "#1d4ed8" : "#047857";
      const fontSize = typeof width === "number" ? Math.max(14, width * 0.58) : "clamp(15px, 4vw, 22px)";
      return (
        <div style={{ width, aspectRatio: "66 / 90" }} className="shrink-0">
          {!error ? (
            <img className="tile-img" src={tilePath(suit, num)} alt={`${suit}${num}`} decoding="sync" loading="eager" onError={() => setError(true)} />
          ) : (
            <div className="tile-fallback" style={{ fontSize, color }}>{num}</div>
          )}
        </div>
      );
    }

    function UnlockFlash({ label, onDone }) {
      const payload = typeof label === "string" ? { label, variant: "normal" } : label;
      const modeLabel = payload?.label || "裏モード";
      const isUra = payload?.variant === "ura";
      const plateStops = isUra
        ? ["#3a1f58", "#211134", "#0c0715"]
        : ["#ffcf6a", "#f08a24", "#632308"];
      const plateStroke = isUra ? "#8e6ade" : "#ffe19a";
      const plateText = isUra ? "#f6f2df" : "#1e1004";
      const stageText = isUra ? "裏モード" : modeLabel;
      const stageFontSize = stageText.length > 8 ? 18 : 24;
      useEffect(() => {
        const id = setTimeout(onDone, 2650);
        return () => clearTimeout(id);
      }, []);
      return (
        <div className="unlock-overlay fixed inset-0 z-50 grid place-items-center bg-black/75 px-4">
          <div className={`panel unlock-card ${isUra ? "ura" : "normal"} w-full max-w-sm rounded-3xl p-6 text-center`}>
            <div className="relative mx-auto mb-5 h-36 w-full max-w-xs">
              <svg viewBox="0 0 268 150" className="unlock-stage h-full w-full" role="img" aria-label="裏モード解放">
                <defs>
                  <linearGradient id="unlockPlate" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0%" stopColor={plateStops[0]} />
                    <stop offset="48%" stopColor={plateStops[1]} />
                    <stop offset="100%" stopColor={plateStops[2]} />
                  </linearGradient>
                  <linearGradient id="unlockGold" x1="0" x2="1" y1="0" y2="1">
                    <stop offset="0%" stopColor="#fff0ae" />
                    <stop offset="52%" stopColor="#d8a83c" />
                    <stop offset="100%" stopColor="#7c5218" />
                  </linearGradient>
                  <linearGradient id="unlockSteel" x1="0" x2="1" y1="0" y2="1">
                    <stop offset="0%" stopColor="#e7e1d4" />
                    <stop offset="45%" stopColor="#878b92" />
                    <stop offset="100%" stopColor="#282d35" />
                  </linearGradient>
                  <filter id="unlockInnerShadow">
                    <feDropShadow dx="0" dy="4" stdDeviation="5" floodColor="#000" floodOpacity="0.45" />
                  </filter>
                </defs>

                <rect className="unlock-button-plate" x="18" y="34" width="232" height="84" rx="18" fill="url(#unlockPlate)" stroke={plateStroke} strokeWidth="2" filter="url(#unlockInnerShadow)" />
                <path d="M24 42h220" stroke="#ffffff" strokeOpacity="0.14" strokeWidth="2" />
                <text x="134" y="86" textAnchor="middle" fill={plateText} fontSize={stageFontSize} fontWeight="900">{stageText}</text>

                <g className="unlock-chain-left" fill="none" stroke="url(#unlockSteel)" strokeWidth="9" strokeLinecap="round">
                  <path d="M12 54 C54 42, 78 62, 114 76" />
                  <path d="M18 101 C58 86, 80 92, 118 78" />
                </g>
                <g className="unlock-chain-right" fill="none" stroke="url(#unlockSteel)" strokeWidth="9" strokeLinecap="round">
                  <path d="M256 54 C214 42, 190 62, 154 76" />
                  <path d="M250 101 C210 86, 188 92, 150 78" />
                </g>

                <g className="unlock-lock">
                  <path d="M112 70V56c0-14 10-24 22-24s22 10 22 24v14" fill="none" stroke="#d9d5ca" strokeWidth="9" strokeLinecap="round" />
                  <rect x="105" y="66" width="58" height="44" rx="9" fill="url(#unlockSteel)" stroke="#f7ecd0" strokeOpacity="0.5" />
                  <path d="M118 74h34" stroke="#fff" strokeOpacity="0.42" strokeWidth="3" strokeLinecap="round" />
                  <path d="M134 83c-4 0-7 3-7 7 0 3 2 5 4 6l-3 8h12l-3-8c3-1 4-3 4-6 0-4-3-7-7-7Z" fill="#130b1d" />
                </g>

                <g className="unlock-key">
                  <circle cx="204" cy="78" r="11" fill="none" stroke="url(#unlockGold)" strokeWidth="7" />
                  <path d="M192 78h-58" stroke="url(#unlockGold)" strokeWidth="7" strokeLinecap="round" />
                  <path d="M150 78v12m13-12v9" stroke="url(#unlockGold)" strokeWidth="7" strokeLinecap="round" />
                </g>

                <g className="unlock-spark" fill="none" stroke="#f2d27b" strokeWidth="4" strokeLinecap="round">
                  <path d="M134 22v14M134 118v14M91 78H77M191 78h-14M102 46l-10-10M166 46l10-10M102 110l-10 10M166 110l10 10" />
                </g>
              </svg>
            </div>
            <p className="text-sm font-bold text-[color:var(--gold-2)]">UNLOCKED</p>
            <p className="mt-1 text-2xl font-black">{isUra ? `${modeLabel} 裏モード` : modeLabel}</p>
          </div>
        </div>
      );
    }

    function sameSet(a, b) {
      const aa = uniqueSorted(a);
      const bb = uniqueSorted(b);
      return aa.length === bb.length && aa.every((v, i) => v === bb[i]);
    }

    function normalizeSavedQuestion(q) {
      const tiles = sortedTiles(q.tiles);
      const answers = uniqueSorted(q.answers);
      return {
        favoriteId: `${q.baseId}-${q.suit}-${tiles.join("")}-${answers.join("")}`,
        baseId: q.baseId,
        tileCount: q.tileCount,
        tiles,
        answers,
        suit: q.suit || "m"
      };
    }

    function dedupeQuestions(items) {
      const seen = new Set();
      const out = [];
      for (const item of items) {
        const key = item.favoriteId || `${item.baseId}-${item.suit}-${item.tiles.join("")}-${item.answers.join("")}`;
        if (seen.has(key)) continue;
        seen.add(key);
        out.push({ ...item, favoriteId: key });
      }
      return out;
    }

    function inferModeFromList(items) {
      const max = Math.max(...items.map(item => item.tileCount || item.tiles.length), 6);
      if (max >= 10) return "10_20";
      if (max >= 7) return "7";
      return "6";
    }

    function rankClass(rank) {
      if (rank === "神" || rank === "SS") return "rainbow-text";
      if (rank === "S") return "gold-text";
      if (rank?.startsWith("A")) return "text-red-300";
      if (rank?.startsWith("B")) return "text-emerald-300";
      if (rank === "C") return "text-sky-300";
      return "text-slate-300";
    }

    function preloadTiles() {
      ["m", "p", "s"].forEach(suit => {
        for (let n = 1; n <= 9; n++) {
          ensureTileDecoded(suit, n);
        }
      });
      for (let n = 1; n <= 7; n++) {
        ensureTileDecoded("z", n);
      }
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
