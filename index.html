<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      color-scheme: dark;
      --felt-0: #06110f;
      --felt-1: #0b2f28;
      --felt-2: #0f493c;
      --ink: #07100e;
      --ink-2: #0c1715;
      --cream: #f6f2df;
      --muted: #9aa9a4;
      --gold: #d8a83c;
      --gold-2: #f2d27b;
      --red: #c7372f;
      --green: #36a371;
    }
    * { box-sizing: border-box; }
    html, body, #root {
      min-height: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }
    body {
      margin: 0;
      font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "HGS明朝E", "MS PMincho", serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(242, 210, 123, 0.13), transparent 34rem),
        linear-gradient(135deg, var(--felt-1), var(--felt-2) 48%, var(--felt-0));
      color: var(--cream);
      overscroll-behavior: none;
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: pan-y;
      letter-spacing: 0;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 18px 18px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.15));
    }
    button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .menu-mincho {
      font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "HGS明朝E", "MS PMincho", serif;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 2px 0 rgba(0,0,0,0.52), 0 0 14px rgba(242,210,123,0.14);
      -webkit-text-stroke: 0.18px currentColor;
    }
    .menu-mincho h1,
    .menu-mincho h2,
    .menu-mincho button {
      font-weight: 900;
    }
    body.play-lock {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }
    body.play-lock * {
      touch-action: none !important;
    }
    body:not(.play-lock) {
      position: static;
      height: auto;
      overflow-y: auto;
      touch-action: pan-y;
    }
    .app-shell {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
    .app-scroll {
      height: 100vh;
      height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-x: none;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    .app-play {
      position: fixed;
      inset: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
    }
    .panel {
      background: linear-gradient(180deg, rgba(7,16,14,0.94), rgba(12,23,21,0.94));
      border: 1px solid rgba(242, 210, 123, 0.18);
      box-shadow: 0 24px 60px rgba(0,0,0,0.34);
    }
    .pressable { transform: translateY(0); transition: transform 120ms ease, filter 120ms ease, background 120ms ease; }
    .pressable:active { transform: translateY(2px) scale(0.99); }
    .btn-main {
      background:
        radial-gradient(circle at 50% 0%, rgba(255,241,198,0.42), transparent 72%),
        linear-gradient(180deg, #a06f46, #4b3021 48%, #15100d);
      color: #f7e0a7;
      border: 1px solid rgba(185,139,85,0.68);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 12px 24px rgba(0,0,0,0.30);
      text-shadow: 0 2px 4px rgba(0,0,0,0.72);
    }
    .btn-play-normal {
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.36), transparent 64%),
        linear-gradient(180deg, #ffcf6a, #f08a24 42%, #632308);
      color: #1e1004;
      border: 1px solid rgba(255,225,154,0.58);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.26), 0 12px 24px rgba(0,0,0,0.32), 0 0 18px rgba(240,138,36,0.18);
      text-shadow: 0 1px 1px rgba(255,237,189,0.38);
    }
    .btn-danger {
      background: linear-gradient(180deg, #e05248, #9f211d);
      color: #fff7ed;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 12px 22px rgba(0,0,0,0.24);
    }
    .btn-ura {
      background:
        radial-gradient(circle at 50% 0%, rgba(242,210,123,0.2), transparent 68%),
        linear-gradient(180deg, #5b3290, #26123e 58%, #12091f);
      color: #fff7ed;
      border: 1px solid rgba(194,159,255,0.42);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 12px 24px rgba(0,0,0,0.28), 0 0 18px rgba(117,76,180,0.28);
      text-shadow: 0 2px 5px rgba(0,0,0,0.65);
    }
    .btn-quiet { background: rgba(246,242,223,0.06); color: var(--cream); border: 1px solid rgba(246,242,223,0.12); }
    .btn-locked {
      position: relative;
      overflow: hidden;
      min-height: 50px;
      background:
        linear-gradient(180deg, rgba(15,7,28,0.2), rgba(5,3,10,0.32)),
        url("assets/ura-lock-button.png") center / cover no-repeat,
        linear-gradient(180deg, #3a1f58, #0c0715);
      color: #f6f2df;
      border: 1px solid rgba(169, 128, 255, 0.45);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 12px 28px rgba(0,0,0,0.36), 0 0 18px rgba(88,52,139,0.25);
    }
    .btn-locked::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,0.16), transparent 34%), linear-gradient(180deg, transparent, rgba(0,0,0,0.22));
    }
    .btn-locked-title {
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9), 0 0 10px rgba(242,210,123,0.35);
    }
    .btn-sealed-normal {
      position: relative;
      overflow: hidden;
      min-height: 50px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.24), transparent 60%),
        linear-gradient(180deg, #f0d37a, #b6842d);
      color: #1e1607;
      border: 1px solid rgba(255,240,174,0.38);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 12px 22px rgba(0,0,0,0.24);
    }
    .btn-sealed-normal::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.18)),
        url("assets/ura-lock-button.png") center / cover no-repeat;
      opacity: 0.78;
    }
    .btn-sealed-normal::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(7,4,10,0.06), rgba(7,4,10,0.22));
    }
    .sealed-title {
      position: relative;
      z-index: 1;
      opacity: 0.26;
      text-shadow: 0 1px 2px rgba(255,255,255,0.35);
    }
    .locked-mode-wrap { position: relative; }
    .unlock-hint {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      z-index: 5;
      width: max-content;
      max-width: 210px;
      transform: translateX(-50%) translateY(4px);
      opacity: 0;
      pointer-events: none;
      border: 1px solid rgba(242,210,123,0.22);
      border-radius: 12px;
      background: rgba(4,5,10,0.96);
      padding: 8px 10px;
      color: #f6f2df;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.45;
      box-shadow: 0 12px 24px rgba(0,0,0,0.36);
      transition: opacity 140ms ease, transform 140ms ease;
    }
    .locked-mode-wrap:hover .unlock-hint,
    .locked-mode-wrap:focus-within .unlock-hint,
    .locked-mode-wrap.hint-open .unlock-hint {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .server-logo {
      width: clamp(58px, 17vw, 76px);
      aspect-ratio: 1;
      border-radius: 999px;
      object-fit: cover;
      border: 2px solid rgba(242,210,123,0.32);
      box-shadow: 0 12px 28px rgba(0,0,0,0.34), 0 0 0 4px rgba(255,255,255,0.04);
      background: rgba(246,242,223,0.08);
    }
    .star-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 100px;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid #e5dfc7;
      background: #fbfaf2;
      color: #26302d;
      font-weight: 900;
      font-size: 14px;
      line-height: 1;
      text-shadow: none;
      box-shadow: none;
    }
    .star-btn .star-mark { color: #facc15; font-size: 15px; transform: translateY(-0.5px); }
    .star-btn.active {
      color: #78868a;
      background: #eef2f3;
      border-color: #d7e0df;
      opacity: 0.72;
      filter: grayscale(0.35);
      text-shadow: none;
    }
    .star-btn.active .star-mark { color: #94a3b8; }
    .star-btn-small {
      min-width: 86px;
      min-height: 32px;
      padding: 0 10px;
      font-size: 12px;
    }
    .star-btn-small .star-mark { font-size: 13px; }
    .star-btn.just-added { animation: star-pop 420ms cubic-bezier(.2,.9,.18,1.18) both; }
    @keyframes star-pop {
      0% { transform: scale(0.76); }
      58% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .tile-img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 7px 7px rgba(0,0,0,0.26)); }
    .tile-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: #1f1a10;
      background: linear-gradient(180deg, #fffdf0, #e7ddc7);
      border: 1px solid rgba(60, 45, 20, 0.18);
      font-weight: 900;
      box-shadow: 0 8px 12px rgba(0,0,0,0.22);
    }
    .answer-btn {
      min-height: 0;
      aspect-ratio: 1;
      width: 100%;
      border-radius: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.42), transparent 62%),
        linear-gradient(180deg, #fffdf0, #e6dcc4);
      color: #16120a;
      font-weight: 900;
      font-size: 24px;
      border: 1px solid rgba(4,8,7,0.38);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.38), inset 0 -2px 0 rgba(22,18,10,0.12);
    }
    .answer-btn.selected {
      background: linear-gradient(180deg, #f2d27b, #bd8b2f);
      color: #1f1606;
      box-shadow: 0 0 0 3px rgba(242,210,123,0.28), 0 12px 22px rgba(0,0,0,0.28);
    }
    .answer-btn.wrong {
      color: #fff7f8;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.28), transparent 54%),
        linear-gradient(180deg, #ff536e, #98102a);
      border-color: rgba(255,255,255,0.38);
      box-shadow: 0 0 0 3px rgba(255,49,90,0.34), 0 0 22px rgba(255,49,90,0.56), inset 0 1px 0 rgba(255,255,255,0.3);
      animation: wrong-answer-hit 720ms cubic-bezier(.18,.9,.2,1) both;
    }
    @keyframes wrong-answer-hit {
      0% { transform: translateX(0); filter: saturate(1); }
      42% { transform: translateX(0); filter: saturate(1.15); }
      50% { transform: translateX(-4px); }
      58% { transform: translateX(4px); }
      66% { transform: translateX(-2px); }
      74%, 100% { transform: translateX(0); filter: saturate(1.35); }
    }
    .answer-btn.disabled {
      opacity: 0.28;
      filter: grayscale(1);
    }
    .answer-btn.ura {
      background:
        radial-gradient(circle at 50% 0%, rgba(169,128,255,0.16), transparent 64%),
        linear-gradient(180deg, #151020, #050807);
      color: #f6f2df;
      border-color: rgba(246,242,223,0.22);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -2px 0 rgba(0,0,0,0.35);
    }
    .answer-pad {
      overflow: hidden;
      border-radius: 18px;
      width: min(74vw, 264px);
      margin-left: auto;
      box-shadow: 0 14px 28px rgba(0,0,0,0.32), 0 0 0 1px rgba(246,242,223,0.16);
      background: rgba(246,242,223,0.22);
    }
    .answer-pad.size-large {
      width: 100%;
      max-width: none;
      margin-left: 0;
    }
    .settings-preview .answer-pad.size-large {
      width: 100%;
      max-width: 312px;
      margin-left: 0;
    }
    .settings-preview .answer-pad.size-normal {
      width: 82%;
      max-width: 264px;
      margin-left: auto;
    }
    .answer-pad.size-small {
      width: min(55vw, 205px);
    }
    .settings-preview .answer-pad.size-small {
      width: 64%;
      max-width: 205px;
    }
    .volume-slider {
      height: 4px;
      cursor: pointer;
    }
    .volume-slider::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(242,210,123,0.95), rgba(255,255,255,0.78));
    }
    .volume-slider::-webkit-slider-thumb {
      margin-top: -6px;
    }
    .volume-slider::-moz-range-track {
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(242,210,123,0.95), rgba(255,255,255,0.78));
    }
    .volume-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
    }
    .answer-action {
      width: min(74vw, 264px);
      margin-left: auto;
    }
    .answer-action.size-large {
      width: 100%;
      max-width: none;
      margin-left: 0;
    }
    .answer-action.size-small {
      width: min(55vw, 205px);
    }
    .answer-confirm {
      min-height: 62px;
      border-radius: 0 0 18px 18px;
    }
    .feedback {
      height: 48px;
      display: grid;
      place-items: center;
      font-weight: 900;
      border-radius: 999px;
      transform-origin: center;
    }
    .feedback.ok { background: rgba(54,163,113,0.18); color: #b9f5d5; animation: feedback-pop 480ms ease both; }
    .feedback.ng { background: rgba(199,55,47,0.20); color: #ffd7d3; animation: shake 360ms ease both; }
    .answer-zone {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
    }
    .judge-flash {
      position: absolute;
      left: 4px;
      top: 0;
      width: clamp(58px, 18vw, 82px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 18px;
      font-size: clamp(46px, 13vw, 70px);
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
      opacity: 0;
      animation: judge-flash 1s ease both;
      text-shadow: 0 5px 14px rgba(0,0,0,0.55);
      filter: drop-shadow(0 0 14px currentColor);
    }
    .judge-flash.ok { color: #ff4b4b; }
    .judge-flash.ng { color: #63a7ff; }
    .answer-zone.align-left { justify-content: flex-start; }
    .answer-zone.align-center { justify-content: center; }
    .answer-zone.align-right { justify-content: flex-end; }
    .answer-pad.align-left,
    .answer-action.align-left,
    .ura-fail-pad.align-left,
    .settings-preview .answer-pad.align-left {
      margin-left: 0;
      margin-right: auto;
    }
    .answer-pad.align-center,
    .answer-action.align-center,
    .ura-fail-pad.align-center,
    .settings-preview .answer-pad.align-center {
      margin-left: auto;
      margin-right: auto;
    }
    .answer-pad.align-right,
    .answer-action.align-right,
    .ura-fail-pad.align-right,
    .settings-preview .answer-pad.align-right {
      margin-left: auto;
      margin-right: 0;
    }
    .answer-zone.align-left .judge-flash {
      left: auto;
      right: 4px;
    }
    @keyframes judge-flash {
      0% { opacity: 0; transform: scale(0.72) translateY(6px); }
      16% { opacity: 1; transform: scale(1.08) translateY(0); }
      72% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.96) translateY(-4px); }
    }
    @keyframes feedback-pop {
      0% { transform: scale(0.78); opacity: 0; }
      62% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      22% { transform: translateX(-8px); }
      48% { transform: translateX(7px); }
      72% { transform: translateX(-3px); }
    }
    @keyframes resultPop {
      0% { transform: scale(0.6); opacity: 0; }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 0.95; }
    }
    .result-pop { animation: resultPop 520ms cubic-bezier(.2,.9,.2,1) both; }
    .record-card {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(242,210,123,0.2), transparent 13rem),
        linear-gradient(180deg, rgba(8,18,16,0.98), rgba(4,8,7,0.98));
    }
    .record-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(120deg, transparent 8%, rgba(255,255,255,0.18) 18%, transparent 28%);
      transform: translateX(-120%);
      animation: result-sheen 1.25s ease 220ms both;
    }
    @keyframes result-sheen {
      to { transform: translateX(120%); }
    }
    .record-rays {
      position: absolute;
      inset: -30%;
      opacity: 0;
      pointer-events: none;
      background:
        conic-gradient(from 0deg, transparent 0 8deg, rgba(242,210,123,0.15) 8deg 12deg, transparent 12deg 24deg);
      animation: rays-spin 1.6s ease-out 120ms both;
    }
    @keyframes rays-spin {
      0% { transform: rotate(0deg) scale(0.7); opacity: 0; }
      24% { opacity: 1; }
      100% { transform: rotate(32deg) scale(1.12); opacity: 0; }
    }
    .score-gauge {
      position: relative;
      width: min(228px, 72vw);
      aspect-ratio: 1;
      margin: 0 auto;
      overflow: visible;
    }
    .score-gauge svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
      filter: drop-shadow(0 16px 22px rgba(0,0,0,0.38));
    }
    .score-gauge-track { stroke: rgba(246,242,223,0.08); }
    .score-gauge-segment {
      opacity: 0.72;
      stroke-linecap: butt;
    }
    .score-gauge-segment.cap {
      opacity: 0.95;
      stroke-linecap: round;
      filter: drop-shadow(0 0 7px rgba(255,255,255,0.28));
    }
    .score-gauge-segment.rainbow {
      opacity: 1;
      stroke-width: 12;
      filter:
        drop-shadow(0 0 6px rgba(255,45,130,0.48))
        drop-shadow(0 0 10px rgba(0,200,255,0.34));
      animation: rainbow-band-pulse 1.6s ease-in-out infinite alternate;
    }
    @keyframes rainbow-band-pulse {
      0% { opacity: 0.78; filter: drop-shadow(0 0 4px rgba(255,45,130,0.35)) drop-shadow(0 0 8px rgba(0,200,255,0.22)); }
      100% { opacity: 1; filter: drop-shadow(0 0 9px rgba(255,45,130,0.72)) drop-shadow(0 0 14px rgba(0,200,255,0.48)); }
    }
    .score-gauge-fill {
      stroke: url(#scoreGaugeFill);
      stroke-linecap: round;
    }
    .score-gauge-center {
      position: absolute;
      inset: 15%;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 0%, rgba(242,210,123,0.16), transparent 62%),
        linear-gradient(180deg, rgba(4,8,7,0.94), rgba(0,0,0,0.72));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), inset 0 16px 32px rgba(255,255,255,0.035);
    }
    .score-number {
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 16px rgba(242,210,123,0.24);
    }
    .score-rank {
      opacity: 0;
      transform: scale(0.72);

    function getValidShifts(tiles, answers, allowClippedAnswers = true) {
      const minTile = Math.min(...tiles);
      const maxTile = Math.max(...tiles);
      const minAns = Math.min(...answers);
      const maxAns = Math.max(...answers);
      const minK = allowClippedAnswers ? Math.max(-3, 1 - minTile) : Math.max(-3, 1 - minTile, 1 - minAns);
      const maxK = allowClippedAnswers ? Math.min(3, 9 - maxTile) : Math.min(3, 9 - maxTile, 9 - maxAns);
      const shifts = [];
      for (let k = minK; k <= maxK; k++) {
        if (!allowClippedAnswers || answers.some(n => n + k >= 1 && n + k <= 9)) shifts.push(k);
      }
      if (shifts.length === 0) shifts.push(0);
      return shifts;
    }

    function forcedShiftsFor(baseId, mirrored) {
      if (baseId === "7-18") return [0];
      if (baseId === "6-12") return mirrored ? [-3, -2, -1, 0] : [0, 1, 2, 3];
      if (baseId === "7-2") return [0];
      if (baseId === "7-10") return mirrored ? [-2, -1, 0, 1] : [-1, 0, 1, 2];
      if (baseId === "7-13") return [-2, -1, 0, 1, 2];
      return null;
    }

    function transformQuestion(base) {
      const suit = ["m", "p", "s"][Math.floor(Math.random() * 3)];
      const mirrored = Math.random() < 0.5;
      const mirror = n => mirrored ? 10 - n : n;
      const mirroredTiles = base.tiles.map(mirror);
      const mirroredAnswers = base.answers.map(mirror);
      const allowClippedAnswers = base.tileCount !== 10;
      const forcedShifts = forcedShiftsFor(base.baseId, mirrored);
      const shifts = forcedShifts || getValidShifts(mirroredTiles, mirroredAnswers, allowClippedAnswers);
      const k = shifts[Math.floor(Math.random() * shifts.length)];
      const tiles = mirroredTiles.map(n => n + k).sort((a, b) => a - b);
      const answers = uniqueSorted(mirroredAnswers.map(n => n + k).filter(n => n >= 1 && n <= 9));
      return {
        ...base,
        instanceId: `${base.baseId}-${Date.now()}-${Math.random().toString(36).slice(2)}`,
        tiles,
        answers,
        suit,
        mirrored,
        shift: k
      };
    }

    function rankGaugeSegments(modeId) {
      const order = ["E", "D", "C", "B-", "B", "B+", "A-", "A", "A+", "S", "SS"];
      const colors = {
        E: "#64748b",
        D: "#6b7280",
        C: "#38bdf8",
        "B-": "#34d399",
        B: "#10b981",
        "B+": "#22c55e",

        A: "#f87171",
        "A+": "#ef4444",
        S: "#d8a83c",
        SS: "url(#scoreGaugeRainbow)"
      };
      return order.map((rank, index) => {
        const start = index === 0 ? 0 : (index + 1) / 12;
        const end = index === 0 ? 2 / 12 : (index + 2) / 12;
        return {
          rank,
          start,
          end,
          color: colors[rank]
        };
      });
    }

    function scoreGaugeProgress(modeId, score) {
      const key = getMode(modeId)?.rankKey || modeId;
      const thresholds = Object.fromEntries((RANKS[key] || RANKS["6"]).map(([rank, value]) => [rank, value]));
      const bands = [
        { startRank: null, endRank: "D", start: 0, end: 2 / 12 },
        { startRank: "D", endRank: "C", start: 2 / 12, end: 3 / 12 },
        { startRank: "C", endRank: "B-", start: 3 / 12, end: 4 / 12 },
        { startRank: "B-", endRank: "B", start: 4 / 12, end: 5 / 12 },
        { startRank: "B", endRank: "B+", start: 5 / 12, end: 6 / 12 },
        { startRank: "B+", endRank: "A-", start: 6 / 12, end: 7 / 12 },
        { startRank: "A-", endRank: "A", start: 7 / 12, end: 8 / 12 },
        { startRank: "A", endRank: "A+", start: 8 / 12, end: 9 / 12 },
        { startRank: "A+", endRank: "S", start: 9 / 12, end: 10 / 12 },
        { startRank: "S", endRank: "SS", start: 10 / 12, end: 11 / 12 },
        { startRank: "SS", endRank: "神", start: 11 / 12, end: 1 }
      ];
      const safeScore = Math.max(0, Number(score) || 0);
      for (const band of bands) {
        const low = band.startRank ? thresholds[band.startRank] : 0;
        const high = thresholds[band.endRank];
        if (!Number.isFinite(high)) continue;
        if (safeScore < high) {
          const span = Math.max(1, high - low);
          const t = Math.min(Math.max((safeScore - low) / span, 0), 1);
          return band.start + (band.end - band.start) * t;
        }
      }
      return 1;
    }

      const seenNames = new Set();

        const key = rankingNameKey(row.player_name);
        if (seenNames.has(key)) return false;

    async function fetchRankings(modeId, period) {
      const client = getSupabaseClient();

      let query = client
        .from(SUPABASE_CONFIG.table)
        .select("player_name,mode_id,mode_label,score,rank,elapsed_seconds,average_seconds,submitted_at")
        .eq("mode_id", modeId)
        .order("score", { ascending: false })
        .order("elapsed_seconds", { ascending: true })
        .order("submitted_at", { ascending: true })
        .limit(RANKING_FETCH_LIMIT);
      const startIso = periodStartIso(period);
      if (startIso) query = query.gte("submitted_at", startIso);
      const { data, error } = await query;
      if (error) throw error;
      return dedupeRankingRows(data, RANKING_DISPLAY_LIMIT);

    function ensureTileDecoded(suit, num) {
      const src = tilePath(suit, num);
      if (TILE_DECODE_CACHE.has(src)) return TILE_DECODE_CACHE.get(src);
      const promise = new Promise(resolve => {
        const img = new Image();
        TILE_IMAGE_CACHE.set(src, img);
        img.onload = async () => {
          try {
            if (img.decode) await img.decode();
          } catch {}
          resolve(src);
        };
        img.onerror = () => resolve(src);
        img.src = src;
      });
      TILE_DECODE_CACHE.set(src, promise);
      return promise;
    }

    function App() {

      useEffect(() => {

        if (viewport) viewport.setAttribute("content", lockedViewport);
        let lastTouchEnd = 0;
        const preventZoomGesture = e => e.preventDefault();

        const preventDoubleTapZoom = e => {

          document.removeEventListener("gesturestart", preventZoomGesture);

      function tap(handler) {
        return {
          onTouchStart: () => { touchRef.current = true; ensureAudio(); handler(); },

      function resetViewportScroll() {
        const targets = [
          appShellRef.current,
          document.scrollingElement,
          document.documentElement,
          document.body
        ].filter(Boolean);
        targets.forEach(target => {
          target.scrollTop = 0;
          target.scrollLeft = 0;

      }

      function downloadBackupData() {
        const payload = makeBackupPayload();
        const blob = new Blob([payload], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = makeBackupFilename();
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return link.download;
      }

      function restoreBackupData(text) {
        const data = parseBackupPayload(text);
        Object.entries(data).forEach(([key, value]) => {
          localStorage.setItem(key, value);

        setFavorites(readJson(STORAGE.favorites, []));

        setResult(null);
        setGame(null);
        setScreen("home");
        setStorageRevision(v => v + 1);
        return Object.keys(data).length;
      }

      function ensureAudio() {
        try {
          const AudioCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtor) return null;
          if (!audioRef.current || audioRef.current.state === "closed") {
            audioRef.current = new AudioCtor();
          }
          const ctx = audioRef.current;
          if (ctx.state !== "running" && ctx.resume) {
            const resumed = ctx.resume();
            if (resumed?.catch) resumed.catch(() => {});
          }
          return ctx;
        } catch {
          audioRef.current = null;
          return null;
        }
      }

      function tone(type) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const volumeScale = Math.max(0, Math.min(3, Number(soundVolume))) / 3;
        if (volumeScale <= 0) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const output = ctx.createGain();
        output.gain.setValueAtTime(volumeScale, now);
        output.connect(ctx.destination);
        osc.connect(gain);
        gain.connect(output);
        if (type === "ok") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.exponentialRampToValueAtTime(990, now + 0.12);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === "ng") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.exponentialRampToValueAtTime(92, now + 0.2);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.23);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === "stamp") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(78, now + 0.1);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.2, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.24);

          const hit = ctx.createOscillator();
          const hitGain = ctx.createGain();
          hit.type = "square";
          hit.frequency.setValueAtTime(92, now + 0.06);
          hit.frequency.exponentialRampToValueAtTime(58, now + 0.18);
          hitGain.gain.setValueAtTime(0.0001, now + 0.05);
          hitGain.gain.exponentialRampToValueAtTime(0.18, now + 0.07);
          hitGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
          hit.connect(hitGain);
          hitGain.connect(output);
          hit.start(now + 0.05);
          hit.stop(now + 0.22);

          const pop = ctx.createOscillator();
          const popGain = ctx.createGain();
          pop.type = "sine";
          pop.frequency.setValueAtTime(520, now + 0.015);
          pop.frequency.exponentialRampToValueAtTime(310, now + 0.08);
          popGain.gain.setValueAtTime(0.0001, now + 0.01);
          popGain.gain.exponentialRampToValueAtTime(0.055, now + 0.018);
          popGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
          pop.connect(popGain);
          popGain.connect(output);
          pop.start(now + 0.01);
          pop.stop(now + 0.1);
        } else {
          osc.type = "square";
          osc.frequency.setValueAtTime(520, now);
          gain.gain.setValueAtTime(0.035, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
          osc.start(now);
          osc.stop(now + 0.055);
        }
      }

      function startMode(modeId, variant = "normal", sourceList = null) {
        ensureAudio();
        resetViewportScroll();
        inputLockRef.current = false;
        setJudgeFlash(null);
        const baseMode = getMode(modeId) || MODES[0];
        let bases;
        if (sourceList?.length) {
          bases = shuffle(sourceList);
        } else {
          const datasetKey = baseMode.tileCount === 10 ? "10" : String(baseMode.tileCount);
          bases = shuffle(DATASETS[datasetKey]).slice(0, baseMode.questionCount);
        }
        if (!bases.length) return;
        const questions = sourceList?.length
          ? bases.map(q => transformSavedPracticeQuestion(q))
          : bases.map(q => transformQuestion(q));
        setGame({
          mode: baseMode,
          variant,
          questions,
          sourceList: sourceList ? sourceList.map(normalizeSavedQuestion) : null,
          index: 0,
          selected: [],
          correctCount: 0,
          mistakeCount: 0,
          wrongQuestions: [],
          feedback: null,
          startedAt: monotonicNow(),
          ended: false
        });
        setTick(v => v + 1);
        setScreen("game");
        requestAnimationFrame(resetViewportScroll);
      }

      function currentQuestion() {
        return game?.questions[game.index] || null;
      }

      function saveReviewQuestions(questions) {
        if (!questions?.length) return;
        const bucket = readJson(STORAGE.review, []);
        const merged = dedupeQuestions([...questions.map(q => normalizeSavedQuestion(q)), ...bucket]).slice(0, 200);
        writeJson(STORAGE.review, merged);
        setReview(merged);
      }

      function saveCurrentWrongs() {
        if (game?.wrongQuestions?.length) {
          saveReviewQuestions(game.wrongQuestions);
        }
      }

      function recordProblemAnswer(q, ok) {
        if (!q || !(game?.variant === "normal" || game?.variant === "ura")) return;
        const key = q.baseId || q.id;
        if (!key) return;
        setProblemStats(current => {
          const prev = current[key] || { correct: 0, total: 0 };
          const next = {
            ...current,
            [key]: {
              correct: prev.correct + (ok ? 1 : 0),
              total: prev.total + 1
            }
          };
          writeJson(STORAGE.problemStats, next);
          return next;
        });
      }

      function quitGame() {
        inputLockRef.current = false;
        saveCurrentWrongs();
        setScreen("home");
      }

      function retryGame() {
        const current = game;
        saveCurrentWrongs();
        if (current) startMode(current.mode.id, current.variant, current.sourceList);
      }

      function selectAnswer(num) {
        if (!game || game.feedback || game.ended || inputLockRef.current) return;
        const q = currentQuestion();
        const counts = q.tiles.reduce((acc, n) => ({ ...acc, [n]: (acc[n] || 0) + 1 }), {});
        if ((counts[num] || 0) >= 4) return;
        const alreadySelected = game.selected.includes(num);
        if (game.variant === "ura" && alreadySelected) return;
        tone("tap");
        const selected = alreadySelected
          ? game.selected.filter(n => n !== num)
          : uniqueSorted([...game.selected, num]);
        if (game.variant === "ura") {
          const hit = q.answers.includes(num);
          const completed = sameSet(selected, q.answers);
          if (hit && completed) {
            recordProblemAnswer(q, true);
            inputLockRef.current = true;
            tone("ok");
            showJudge("ok");
            setGame(g => ({ ...g, selected, correctCount: g.correctCount + 1, feedback: "ok" }));
            setTimeout(() => advanceUra(true), 120);
          } else if (hit) {
            setGame(g => ({ ...g, selected }));
          } else {
            recordProblemAnswer(q, false);
            inputLockRef.current = true;
            tone("ng");
            showJudge("ng");
            const wrong = { ...q, selected };
            saveReviewQuestions([wrong]);
            setGame(g => ({
              ...g,
              selected,
              mistakeCount: g.mistakeCount + 1,
              wrongQuestions: [...g.wrongQuestions, wrong],
              feedback: "ng",
              gameOverWrong: num,
              gameOverQuestion: wrong,
              ended: true
            }));
          }
          return;
        }
        setGame(g => ({ ...g, selected }));
      }

      function showJudge(type) {
        const id = Date.now();
        setJudgeFlash({ type, id });
        setTimeout(() => {
          setJudgeFlash(current => current?.id === id ? null : current);
        }, 1000);
      }

      function confirmAnswer() {
        if (!game || game.feedback) return;
        const q = currentQuestion();
        const ok = sameSet(game.selected, q.answers);
        recordProblemAnswer(q, ok);
        tone(ok ? "ok" : "ng");
        showJudge(ok ? "ok" : "ng");
        const wrong = ok ? null : { ...q, selected: [...game.selected] };
        setGame(g => ({
          ...g,
          correctCount: g.correctCount + (ok ? 1 : 0),
          mistakeCount: g.mistakeCount + (ok ? 0 : 1),
          wrongQuestions: wrong ? [...g.wrongQuestions, wrong] : g.wrongQuestions,
          feedback: ok ? "ok" : "ng"
        }));
        setTimeout(() => advanceNormal(), 35);
      }

      function advanceNormal() {
        setGame(g => {
          if (!g) return g;
          if (g.index + 1 >= g.questions.length) {
            setTimeout(() => finishGame(), 0);
            return { ...g, ended: true };
          }
          return { ...g, index: g.index + 1, selected: [], feedback: null };
        });
      }

      function advanceUra() {
        setGame(g => {
          if (!g) return g;
          if (g.index + 1 >= g.questions.length) {
            setTimeout(() => finishGame(), 0);
            return { ...g, ended: true };
          }
          inputLockRef.current = false;
          return { ...g, index: g.index + 1, selected: [], feedback: null };
        });
      }

      function finishGame(extra = {}) {
        setGame(g => {
          if (!g) return g;
          const elapsedSeconds = elapsedSecondsFrom(g.startedAt);
          const forcedWrong = extra.forcedWrong ? [{ ...extra.forcedWrong, selected: extra.selected || [] }] : [];
          const correctCount = extra.uraFailed ? g.correctCount : g.correctCount;
          const mistakeCount = g.mistakeCount + forcedWrong.length;
          const wrongQuestions = [...g.wrongQuestions, ...forcedWrong];
          const score = scoreGame(g.questions.length, correctCount, mistakeCount, elapsedSeconds);
          const rank = rankFor(g.mode.id, score);
          const previousBest = readNumber(g.mode.bestKey);
          const previousElapsed = readNumber(g.mode.elapsedKey);
          const isRankedRun = g.variant === "normal" || g.variant === "ura";
          const isNewRecord = isRankedRun && !extra.gameOver && isBetterBest(score, elapsedSeconds, previousBest, previousElapsed);
          const built = makeResult({
            mode: g.mode,
            variant: g.variant,
            sourceList: g.sourceList,
            questionCount: g.questions.length,
            score,
            rank,
            correctCount,
            mistakeCount,
            elapsedSeconds,
            previousBest,
            isNewRecord,
            gameOver: !!extra.gameOver,
            wrongQuestions
          });
          persistResult(built);
          setResult(built);
          setScreen("result");
          return { ...g, ended: true };
        });
      }

      function persistResult(res) {
        const mode = getMode(res.modeId);
        const oldBest = readNumber(mode.bestKey);
        const oldElapsed = readNumber(mode.elapsedKey);
        const isRankedRun = (res.variant === "normal" || res.variant === "ura") && !res.gameOver;
        if (isRankedRun && isBetterBest(res.score, res.elapsedSeconds, oldBest, oldElapsed)) {
          localStorage.setItem(mode.bestKey, String(res.score));
          localStorage.setItem(mode.elapsedKey, String(res.elapsedSeconds));
          if (res.variant === "normal") {
            const previousRank = rankFor(res.modeId, oldBest);
            const unlocks = [];
            if (!rankAtLeast(previousRank, "S") && rankAtLeast(res.rank, "S")) {
              unlocks.push({ label: mode.label, variant: "ura", modeIds: [mode.id] });
            }
            const next = newlyUnlockedModes(res.modeId, previousRank, res.rank);
            if (next.length) {
              const label = next.map(mode => mode.label.replace("十枚形 ", "")).join("・");
              unlocks.push({ label: next.length > 1 ? `十枚形 ${label}` : next[0].label, variant: "normal", modeIds: next.map(mode => mode.id) });
            }
            enqueueUnlockFlashes(unlocks);
          }
        }
        if ((res.variant === "normal" || res.variant === "ura") && res.wrongQuestions.length) {
          saveReviewQuestions(res.wrongQuestions);
        }
        if ((res.variant === "normal" || res.variant === "ura") && !res.gameOver) {
          const history = readJson(STORAGE.results, []);
          const nextHistory = [res, ...history].slice(0, 500);
          writeJson(STORAGE.results, nextHistory);
          setResultsHistory(nextHistory);
          setDailySummary(current => {
            const day = dateKey(res.finishedAt);
            const key = `${day}:${res.modeId}`;
            const prev = current[key] || {
              date: day,
              modeId: res.modeId,
              playCount: 0,
              bestScore: 0,
              bestRank: "E",
              bestElapsed: 0,
              bestQuestionCount: res.questionCount,
              bestAverageSeconds: null,
              totalScore: 0,
              totalCorrect: 0,
              totalMistakes: 0,
              totalElapsed: 0,
              recordCount: 0
            };
            const resAverage = Number((res.elapsedSeconds / Math.max(1, res.questionCount)).toFixed(1));
            const prevAverage = prev.bestAverageSeconds ?? Infinity;
            const isDailyBest = res.score > (prev.bestScore || 0) || (res.score === prev.bestScore && resAverage < prevAverage);
            const next = {
              ...current,
              [key]: {
                ...prev,
                playCount: prev.playCount + 1,
                bestScore: isDailyBest ? res.score : prev.bestScore,
                bestRank: isDailyBest ? res.rank : prev.bestRank,
                bestElapsed: isDailyBest ? res.elapsedSeconds : prev.bestElapsed,
                bestQuestionCount: isDailyBest ? res.questionCount : prev.bestQuestionCount,
                bestAverageSeconds: isDailyBest ? resAverage : prev.bestAverageSeconds,
                totalScore: prev.totalScore + res.score,
                totalCorrect: prev.totalCorrect + res.correctCount,
                totalMistakes: prev.totalMistakes + res.mistakeCount,
                totalElapsed: prev.totalElapsed + res.elapsedSeconds,
                recordCount: prev.recordCount + (res.isNewRecord ? 1 : 0)
              }
            };
            writeJson(STORAGE.dailySummary, next);
            return next;
          });
        }
      }

      function markResultSubmitted(res) {
        if (!res?.finishedAt) return;
        setResultsHistory(current => {
          const next = current.map(item => item.finishedAt === res.finishedAt ? { ...item, submitted: true } : item);
          writeJson(STORAGE.results, next);
          return next;
        });
      }

      function newlyUnlockedModes(modeId, previousRank, currentRank) {
        return MODES.filter(m =>
          m.unlock?.modeId === modeId &&
          !rankAtLeast(previousRank, m.unlock.rank) &&
          rankAtLeast(currentRank, m.unlock.rank)
        );
      }

      function enqueueUnlockFlashes(payloads) {
        const list = payloads.filter(Boolean);
        if (!list.length) return;
        if (unlockFlash) {
          setUnlockQueue(current => [...current, ...list]);
          return;
        }
        const [first, ...rest] = list;
        setUnlockFlash(first);
        setUnlockQueue(current => [...current, ...rest]);
      }

      function addFavorite(q = currentQuestion()) {
        if (!q) return;
        const saved = normalizeSavedQuestion(q);
        const merged = dedupeQuestions([saved, ...favorites]).slice(0, 80);
        writeJson(STORAGE.favorites, merged);
        setFavorites(merged);
        setFavoriteFlash(saved.favoriteId);
        setTimeout(() => setFavoriteFlash(null), 500);
        tone("tap");
      }

      function isFavorite(q) {
        if (!q) return false;
        const id = normalizeSavedQuestion(q).favoriteId;
        return favorites.some(f => f.favoriteId === id);
      }

      function removeFavorite(id) {
        const next = favorites.filter(f => f.favoriteId !== id);
        writeJson(STORAGE.favorites, next);
        setFavorites(next);
      }

      function clearFavorites() {
        writeJson(STORAGE.favorites, []);
        setFavorites([]);
      }

      function clearReview() {
        writeJson(STORAGE.review, []);
        setReview([]);

      function removeReview(id) {

      }

                    <div className="text-center text-sm font-black text-[color:var(--gold-2)]">{rankingPlaceLabel(rows, idx)}</div>

    function ProblemCatalog({ problemStats, addFavorite, isFavorite, favoriteFlash, tap }) {

      const items = DATASETS[kind].map(base => {

        const rate = stat.total > 0 ? Math.round((stat.correct / stat.total) * 100) : null;
        return {
          ...base,
          suit: suitByKind[kind],
          stat,
          rate
        };
      }).sort((a, b) => {
        if (sortMode !== "weak") return Number(a.id.split("-")[1]) - Number(b.id.split("-")[1]);
        const aRate = a.rate ?? 101;
        const bRate = b.rate ?? 101;
        if (aRate !== bRate) return aRate - bRate;
        if (a.stat.total !== b.stat.total) return b.stat.total - a.stat.total;
